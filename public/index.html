<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menvora Resi - Dashboard API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
    }
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: #1e293b; padding: 40px; border-radius: 16px; width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,.4); border: 1px solid #334155;
    }
    .login-card h1 { font-size: 22px; margin-bottom: 6px; }
    .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 14px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3b82f6;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.sm { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .app { display: none; }
    header {
      background: #1e293b; padding: 16px 24px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 18px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
    .stat .label { color: #94a3b8; font-size: 12px; }
    .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .card h2 { font-size: 15px; margin-bottom: 16px; color: #94a3b8; }
    .row { display: flex; gap: 8px; margin-bottom: 14px; }
    .row input { margin: 0; flex: 1; }
    ul { list-style: none; max-height: 400px; overflow-y: auto; }
    li { padding: 10px 12px; border-bottom: 1px solid #1e293b; font-size: 13px; }
    li .time { color: #64748b; font-size: 11px; margin-right: 8px; }
    .ok { color: #22c55e; } .fail { color: #ef4444; }
    .mono { font-family: monospace; }
    .bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .bar > div { height: 100%; background: #22c55e; }
    #err { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <h1>🔐 Admin Dashboard</h1>
      <p>Menvora Resi - API Cek Resi</p>
      <input type="password" id="pw" placeholder="Password dashboard" />
      <button onclick="doLogin()">Masuk</button>
      <div id="err"></div>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <header>
      <h1>📦 Menvora Resi — Dashboard</h1>
      <button class="secondary sm" onclick="logout()">Logout</button>
    </header>
    <div class="container">
      <div class="stats">
        <div class="stat"><div class="label">Total Proxy</div><div class="value" id="sProxy">0</div></div>
        <div class="stat"><div class="label">Total Request</div><div class="value" id="sReq">0</div></div>
        <div class="stat"><div class="label">Sukses</div><div class="value ok" id="sOk">0</div></div>
        <div class="stat"><div class="label">Gagal</div><div class="value fail" id="sFail">0</div></div>
      </div>

      <div class="grid">
        <div>
          <div class="card">
            <h2>🌐 Proxy Management</h2>
            <div class="row">
              <textarea id="proxyInput" rows="4" placeholder="Satu proxy per baris. Format: host:port[:user:pass] ATAU user:pass:host:port&#10;&#10;Contoh:&#10;niceproxy.io:17522:user:pass&#10;user:pass:niceproxy.io:17522" style="flex:1;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:13px;font-family:monospace;resize:vertical"></textarea>
              <button class="sm" style="align-self:flex-end" onclick="addProxy()">Add</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:14px;">
              <button class="secondary sm" onclick="validateProxies()">Validasi Semua</button>
              <button class="danger sm" onclick="clearProxies()">Hapus Semua</button>
            </div>
            <ul id="proxyList"></ul>
          </div>
        </div>
        <div>
          <div class="card">
            <h2>📋 Log Request</h2>
            <button class="secondary sm" onclick="loadLogs()" style="margin-bottom:10px;">Refresh</button>
            <ul id="logList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem("token") || "";
    const api = {
      base: "",
      headers() {
        return { "Content-Type": "application/json", "x-auth-token": token };
      },
    };

    async function doLogin() {
      const pw = document.getElementById("pw").value;
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
      const d = await r.json();
      if (d.ok) {
        token = d.token;
        localStorage.setItem("token", token);
        showApp();
      } else {
        document.getElementById("err").textContent = "Password salah!";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      location.reload();
    }

    function showApp() {
      document.getElementById("loginWrap").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadDashboard();
    }

    async function authFetch(path, opts = {}) {
      const r = await fetch(path, { ...opts, headers: { ...api.headers(), ...(opts.headers||{}) } });
      if (r.status === 401) { logout(); throw new Error("unauthorized"); }
      return r.json();
    }

    async function loadDashboard() {
      loadStats();
      loadProxy();
      loadLogs();
    }

    async function loadStats() {
      try {
        const d = await authFetch("/api/stats");
        document.getElementById("sProxy").textContent = d.proxyCount;
        document.getElementById("sReq").textContent = d.total;
        document.getElementById("sOk").textContent = d.success;
        document.getElementById("sFail").textContent = d.fail;
      } catch(e) {}
    }

    async function loadProxy() {
      try {
        const d = await authFetch("/api/proxy");
        document.getElementById("sProxy").textContent = d.proxies.length;
        const list = document.getElementById("proxyList");
        list.innerHTML = "";
        d.proxies.forEach((p) => {
          const li = document.createElement("li");
          li.className = "mono";
          li.innerHTML = `<span>${p}</span> <button class="danger sm" style="float:right" onclick="removeProxy('${p}')">Hapus</button>`;
          list.appendChild(li);
        });
      } catch(e) {}
    }

    async function addProxy() {
      const raw = document.getElementById("proxyInput").value.trim();
      if (!raw) return;
      const lines = raw.split(/\n/).map(s => s.trim()).filter(Boolean);
      let added = 0, failed = 0;
      for (const line of lines) {
        const d = await authFetch("/api/proxy", { method: "POST", body: JSON.stringify({ proxy: line }) });
        if (d.ok) added++; else failed++;
      }
      document.getElementById("proxyInput").value = "";
      loadProxy();
      alert(`Selesai: ${added} proxy ditambahkan, ${failed} gagal/duplikat`);
    }

    async function removeProxy(proxy) {
      await authFetch("/api/proxy", { method: "DELETE", body: JSON.stringify({ proxy }) });
      loadProxy();
    }

    async function validateProxies() {
      const d = await authFetch("/api/proxy/validate", { method: "POST" });
      alert(`Validasi selesai: ${d.valid}/${d.total} proxy valid`);
      loadProxy();
    }

    async function clearProxies() {
      if (!confirm("Hapus semua proxy?")) return;
      await authFetch("/api/proxy", { method: "DELETE", body: JSON.stringify({ all: true }) });
      loadProxy();
    }

    async function loadLogs() {
      try {
        const d = await authFetch("/api/logs");
        const list = document.getElementById("logList");
        list.innerHTML = "";
        d.logs.forEach((l) => {
          const li = document.createElement("li");
          const t = new Date(l.ts).toLocaleTimeString("id-ID");
          const cls = l.status === "success" ? "ok" : "fail";
          li.innerHTML = `<span class="time">${t}</span><span class="${cls}">${l.noResi || ""}</span> <span>${l.message || ""}</span>`;
          list.appendChild(li);
        });
      } catch(e) {}
    }

    // Init: jika sudah ada token, langsung tampil.
    if (token) { showApp(); }
  </script>
</body>
</html>
